# =============================================================================
# HEADSCALE + HEADPLANE - DOCKER COMPOSE
# =============================================================================
# Configuración generada/actualizada por install.sh
# Para reconfigurar: ejecuta ./install.sh o edita .env y docker compose up -d

networks:
  headscale-net:
    driver: bridge
    name: ${NETWORK_NAME:-headscale-net}

volumes:
  headscale-data:
    name: headscale-data
  headscale-socket:
    name: headscale-socket
  headplane-data:
    name: headplane-data
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config

services:
  # ---------------------------------------------------------------------------
  # HEADSCALE - Control Plane
  # ---------------------------------------------------------------------------
  headscale:
    image: headscale/headscale:${HEADSCALE_IMAGE_TAG:-latest}
    container_name: headscale
    restart: unless-stopped

    labels:
      # Label para que Headplane pueda identificar este contenedor
      me.tale.headplane.target: "headscale"

    volumes:
      # Configuración
      - ./headscale-config.yaml:/etc/headscale/config.yaml:ro

      # Datos persistentes
      - headscale-data:/var/lib/headscale

      # Socket Unix para comunicación con Headplane
      - headscale-socket:/var/run/headscale

    networks:
      - headscale-net

    ports:
      # Puerto DERP/STUN (UDP) - DEBE estar expuesto para que los clientes se
      # conecten. Es UDP puro: ningún reverse proxy HTTP puede transportarlo.
      - "${HEADSCALE_DERP_PORT:-3478}:3478/udp"

      # La API HTTP (8080) y las métricas (9090) NO se publican: sólo las
      # alcanza Caddy por la red interna de Docker.

    environment:
      - TZ=${TZ:-UTC}

    command: serve

    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - NET_ADMIN

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # HEADPLANE - Web UI
  # ---------------------------------------------------------------------------
  headplane:
    image: ghcr.io/tale/headplane:${HEADPLANE_IMAGE_TAG:-latest}
    container_name: headplane
    restart: unless-stopped

    depends_on:
      headscale:
        condition: service_healthy

    volumes:
      # Configuración
      - ./headplane-config.yaml:/etc/headplane/config.yaml:ro

      # Socket Unix compartido con Headscale
      - headscale-socket:/var/run/headscale:ro

      # Config de Headscale (solo lectura)
      - ./headscale-config.yaml:/etc/headscale/config.yaml:ro

      # Socket de Docker (para integración Docker)
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Datos persistentes de Headplane
      - headplane-data:/var/lib/headplane

    networks:
      - headscale-net

    # Sin 'ports': Headplane no se publica en el host, sólo lo alcanza Caddy
    # por la red interna de Docker. La UI se sirve en /admin del dominio.

    environment:
      - TZ=${TZ:-UTC}
      - CONFIG_PATH=/etc/headplane/config.yaml

    # Healthcheck deshabilitado - el contenedor no tiene wget/curl en PATH
    # El servicio funciona correctamente sin healthcheck
    # healthcheck:
    #   test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 5
    #   start_period: 20s

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # CADDY - Reverse proxy y (opcionalmente) TLS
  # ---------------------------------------------------------------------------
  # Arranca SIEMPRE: es quien enruta el único dominio del stack
  #   /       -> Headscale
  #   /admin  -> Headplane
  # Que además termine TLS depende de SSL_MODE en .env; con 'front' o 'none'
  # sólo hace de reverse proxy por HTTP.
  caddy:
    image: caddy:${CADDY_IMAGE_TAG:-2-alpine}
    container_name: caddy
    restart: unless-stopped

    # service_started, no service_healthy: Headplane no tiene healthcheck (su
    # imagen no trae wget ni curl) y Compose aborta el arranque si se espera
    # por la salud de un servicio que no la publica. Tampoco hace falta: Caddy
    # resuelve los upstreams al atender cada petición, no al arrancar.
    depends_on:
      headscale:
        condition: service_started
      headplane:
        condition: service_started

    volumes:
      # Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Datos persistentes (certificados)
      - caddy-data:/data

      # Configuración persistente
      - caddy-config:/config

      # Logs
      - ./data/caddy-logs:/var/log/caddy

    networks:
      - headscale-net

    # Los puertos los publica docker-compose.override.yml, que genera
    # install.sh: con SSL_MODE=none Caddy sólo escucha en HTTP y publicar 443
    # ocuparía el puerto para nada. Compose fusiona las listas de 'ports'
    # añadiendo, nunca quitando, así que no se pueden declarar aquí.
    # ports:
    #   - "${HTTP_PORT:-80}:80"
    #   - "${HTTPS_PORT:-443}:443"
    #   - "${HTTPS_PORT:-443}:443/udp"

    environment:
      - TZ=${TZ:-UTC}
      - ACME_EMAIL=${ACME_EMAIL:-}

    healthcheck:
      # 127.0.0.1 explícito: el admin API de Caddy sólo escucha en IPv4 y el
      # wget de BusyBox resuelve "localhost" a ::1 primero -> connection refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true
